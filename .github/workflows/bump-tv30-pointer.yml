name: Bump submodule aop em TV30

on:
  push:
    branches: [main]

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV30 (super-projeto)
        uses: actions/checkout@v4
        with:
          repository: multisens/TV30
          token: ${{ secrets.TV30_REPO_TOKEN }}
          submodules: false
          fetch-depth: 0

      - name: Atualizar ponteiro do submodule aop
        env:
          AOP_SHA: ${{ github.sha }}
        run: |
          set -e
          git config user.name  "Luis Claudio Ribeiro Junior"
          git config user.email "luis.junior@ons.org.br"

          CURRENT=$(git ls-tree HEAD aop | awk '{print $3}')
          if [ "$CURRENT" = "$AOP_SHA" ]; then
            echo "Ponteiro ja em $AOP_SHA — sem mudancas"
            exit 0
          fi

          echo "Atualizando ponteiro do submodule aop: $CURRENT -> $AOP_SHA"
          git update-index --cacheinfo 160000 "$AOP_SHA" aop

          git commit -m "chore: bump submodule aop pra ${AOP_SHA:0:7}"
          git push origin main
